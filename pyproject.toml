[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sofm"
version = "0.1.3"
description = "Spatially Orthogonal Factor Model (SOFM)"
readme = "README.md"
authors = [
    { name = "Dan Cunha", email = "dcunha@bu.edu" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scikit-sparse>=0.4.12",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "sympy>=1.12.0",
    "threadpoolctl>=3.2.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "xarray>=2023.5.0",
    "xeofs>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/daniel-s-cunha/SOFM"
